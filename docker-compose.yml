# ============================================================
# docker-compose.yml — Base de données PostgreSQL pour Zrida
# ============================================================
# Démarrer : docker-compose up -d
# Arrêter  : docker-compose down
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: zrida_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zrida_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      # Les données sont persistées dans un volume Docker (elles survivent aux redémarrages)
      - zrida_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zrida_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zrida_postgres_data:
    driver: local
